apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: transaction-latency-alert
  namespace: monitoring
spec:
  groups:
  - name: fintech-api-alerts
    rules:
    - alert: HighTransactionLatency
      expr: rate(transaction_processing_seconds_sum[1m]) / rate(transaction_processing_seconds_count[1m]) > 0.2
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "High API Latency Detected"
        description: "The FinTech API is taking longer than 200ms to process payments."
