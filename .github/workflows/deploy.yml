name: CI/CD FinTech Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Run Tests (Mock)
      run: echo "All FinTech transaction logic tests passed."
      
    - name: Build Docker Image
      run: docker build -t fintech-api:${{ github.sha }} .
