name: CI/CD FinTech Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Build Docker Image
      run: docker build -t fintech-api:${{ github.sha }} .
      
    - name: Set up Kubernetes (KinD)
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: kind
      
    - name: Load Image into KinD
      run: kind load docker-image fintech-api:${{ github.sha }} --name kind
      
    - name: Deploy to K8s
      run: |
        # Create namespace safely
        kubectl create namespace fintech-payments --dry-run=client -o yaml | kubectl apply -f -
        
        # Apply RBAC 
        kubectl apply -f kubernetes/rbac.yaml
        
        # Inject the specific commit SHA into the deployment manifest
        sed -i "s/fintech-api:latest/fintech-api:${{ github.sha }}/g" kubernetes/deployment.yaml
        
        # Deploy the app
        kubectl apply -f kubernetes/deployment.yaml
        
        # Wait for pods to be ready (fails the build if it crashes)
        kubectl rollout status deployment/fintech-api -n fintech-payments
